[project]
name = "redress"
version = "0.1.0"
description = "Multi-pipeline RAG reconciliation engine for auditing insurance claim denials"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Heavy ML deps are optional so the retrieval logic and its tests install and
# run without torch. Nothing in `app.retrieval` imports these at module level.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
