[project]
name = "redress"
version = "0.1.0"
description = "Multi-pipeline RAG reconciliation engine for auditing insurance claim denials"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.69",
    # Golden-set fixtures are YAML because a human has to review them;
    # multi-line policy text in JSON is not reviewable.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy ML deps are optional so the retrieval logic and its tests install and
# run without torch. Nothing in `app.retrieval` imports these at module level.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# The graph layer runs on the in-memory store without this; the driver is
# only needed for the Neo4j backend.
graph = [
    "neo4j>=5.20",
]
# RAGAS pulls a large dependency tree and its default metrics make their own
# LLM calls. The golden-set harness and its metrics work without it.
eval = [
    "ragas>=0.2",
    "datasets>=2.19",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # Generates PDF fixtures for the ingestion tests. PDF is the format users
    # actually upload and the only one whose extraction is lossy, so those
    # tests run against a real rendered file rather than a .txt stand-in.
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
