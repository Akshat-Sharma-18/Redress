id: ca-mh-parity-visit-limit
name: Annual visit cap applied to mental health care the parity clause forbids capping
category: clear_contradiction
source: synthetic
state: CA
insurer_id: ins-demo-acme
denial_date: '2023-06-27'
denial_letter: |
  NOTICE OF ADVERSE BENEFIT DETERMINATION

  Date of Notice: June 27, 2023
  Claim: Outpatient psychotherapy, sessions 21-24, June 2023
  Reason Code: CO-G8

  Benefits are not available for the above sessions. Your plan provides twenty outpatient
  behavioral health visits per calendar year under Section 6.9, and that limit has been reached.

  You may request an internal appeal within 180 days of this notice.
chunks:
- id: p-6-9
  locator: Section 6.9
  source_kind: policy
  text: |
    Outpatient behavioral health visits are covered up to twenty visits per calendar year.
- id: p-6-10
  locator: Section 6.10
  source_kind: policy
  text: |
    Parity. Notwithstanding any visit limit stated in this Certificate, treatment limitations applied
    to mental health and substance use disorder benefits shall be no more restrictive than the
    predominant treatment limitations applied to substantially all medical and surgical benefits.
    Where a stated behavioral health limit is more restrictive, the limit does not apply.
- id: p-6-11
  locator: Section 6.11
  source_kind: policy
  text: |
    No visit limit applies to outpatient medical or surgical office visits under this Certificate.
expected:
  overall: contradicted
  must_cite:
  - p-6-10
