denial_letter: |
  NOTICE OF ADVERSE BENEFIT DETERMINATION

  Date of Notice: December 6, 2022
  Claim: Chiropractic care, visits 18-22, November 2022
  Reason Code: CO-Q4

  Benefits are not available for the above visits. Your plan provides twenty chiropractic visits
  per calendar year under Section 6.12 and that limit has been reached. All five submitted visits
  are denied.

  You may request an internal appeal within 180 days of this notice.
