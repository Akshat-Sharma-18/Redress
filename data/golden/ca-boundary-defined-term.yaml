id: ca-boundary-defined-term
name: Facts sit on the boundary of a defined term
category: ambiguous
source: synthetic
state: CA
insurer_id: ins-demo-acme
denial_date: '2023-03-16'
notes: |
  REVIEWER NOTE - why abstention is correct.

  The definition of Custodial Care turns on whether services "require the
  skills of qualified technical or professional personnel". The submitted
  services are wound care and medication management: tasks that sometimes
  require a licensed nurse and sometimes do not, depending on wound stage and
  the member's capacity to self-administer. Neither fact is in evidence.

  This is deliberately the near-miss twin of ca-custodial-care-justified,
  where the services were bathing and dressing and the definition plainly
  covered them. Here the same definition is retrievable and the same clause
  applies; what is missing is the clinical detail that decides which side of
  the line these facts fall on.

  A reviewer who thinks wound care is self-evidently skilled should relabel
  this. My reason for not doing so: the policy makes it a question about
  these services for this member, and the evidence does not describe them in
  enough detail to answer it.
denial_letter: |
  NOTICE OF ADVERSE BENEFIT DETERMINATION

  Date of Notice: March 16, 2023
  Claim: Home health services, February 2023
  Reason Code: CO-B7

  Benefits are not available for the submitted services. The documentation describes wound care
  and medication management furnished in the home. We have determined these constitute Custodial
  Care, excluded under Section 4.1.

  You may request an internal appeal within 180 days of this notice.
chunks:
- id: p-1-4
  locator: Section 1.4
  source_kind: policy
  text: |
    Custodial Care means assistance with activities of daily living that does not require the skills
    of qualified technical or professional personnel.
- id: p-4-1
  locator: Section 4.1
  source_kind: policy
  text: |
    This plan does not provide benefits for Custodial Care, regardless of where the care is furnished
    or who furnishes it.
- id: p-4-2
  locator: Section 4.2
  source_kind: policy
  text: |
    Skilled Nursing Care furnished in the home is covered when ordered by a physician and when the
    services require the skills of a licensed nurse.
