denial_letter: |
  NOTICE OF ADVERSE BENEFIT DETERMINATION

  Date of Notice: August 15, 2022
  Claim: Physical therapy, date of service July 19, 2022
  Reason Code: CO-18

  This claim has been denied as a duplicate of a claim previously processed for date of service
  July 12, 2022. Duplicate claims are not eligible for separate payment under Section 8.6.

  You may request an internal appeal within 180 days of this notice.
