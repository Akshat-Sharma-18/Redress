id: ca-superseded-statute
name: Prior-authorization denial governed by the statute version then in force
category: clear_justification
source: synthetic
state: CA
insurer_id: ins-demo-acme
denial_date: 2021-08-09
statute_ids:
  - demo-1371-4
notes: |
  The temporal trap, as a case rather than a unit test. A 2023 amendment
  removed the prior-authorization requirement this 2021 denial relies on.
  Judged against current law the denial looks contradicted; judged against
  the law in force on the denial date it is supported.

  "Justified" is the correct expected label, and `must_not_cite` names the
  2023 text — a verdict that reaches "contradicted" by citing a statute that
  had not been enacted is the single most dangerous output this system can
  produce, because it is fluent, well-cited, and wrong.

denial_letter: |
  NOTICE OF ADVERSE BENEFIT DETERMINATION

  Date of Notice: August 9, 2021
  Claim: Outpatient imaging, date of service July 22, 2021
  Reason Code: CO-C3

  Benefits are not available for the above service. Prior authorization was
  required and was not obtained before the service was rendered. Our
  24-hour authorization line was available at the time of service.

  You may request an internal appeal within 180 days.

chunks:
  - id: s-1371-4-2019
    locator: "Demo Ins. Code s 1371.4 (2019)"
    source_kind: statute
    effective_from: 2019-01-01
    effective_to: 2022-12-31
    text: |
      An insurer shall reimburse services necessary to screen and stabilize
      an enrollee, subject to prior authorization where the insurer
      maintains a twenty-four hour authorization line.
  - id: s-1371-4-2023
    locator: "Demo Ins. Code s 1371.4 (2023)"
    source_kind: statute
    effective_from: 2023-01-01
    text: |
      An insurer shall reimburse services necessary to screen and stabilize
      an enrollee, and may not require prior authorization for such
      services.
  - id: p-3-3
    locator: Section 3.3
    source_kind: policy
    text: |
      Prior Authorization. Certain services require prior authorization
      before they are rendered. A list of such services is available on
      request. Benefits may be reduced or denied where required prior
      authorization is not obtained.

expected:
  overall: justified
  must_cite:
    - s-1371-4-2019
  must_not_cite:
    - s-1371-4-2023
