denial_letter: |
  NOTICE OF ADVERSE BENEFIT DETERMINATION

  Date of Notice: January 30, 2023
  Claim: Outpatient advanced imaging, January 2023
  Reason Code: CO-P2

  Benefits are not available for the above service for two reasons. First, prior authorization was
  required under Section 3.5 and was not obtained. Second, the service was rendered by a
  non-participating provider and is excluded entirely under Section 5.2.

  You may request an internal appeal within 180 days of this notice.
