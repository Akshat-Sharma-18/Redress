  locator: Section 3.1
  source_kind: policy
  text: |
    Deductible. Except as otherwise provided in this Certificate, no benefits are payable until
    the member has satisfied the annual deductible shown in the Schedule of Benefits.
- id: p-3-6
  locator: Section 3.6
  source_kind: policy
  text: |
    Preventive Services. Preventive services rated A or B by the United States Preventive
    Services Task Force are covered at one hundred percent of the allowed amount when furnished
    by a participating provider. No deductible, copayment, or coinsurance applies to such
    services.
- id: p-3-7
  locator: Section 3.7
  source_kind: policy
  text: |
    Screening colonoscopy for members aged forty-five and older is a preventive service for
